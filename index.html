
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080016">
<title>VŨ LÊ - Kết nối yêu thương</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080016;
  font-family: Arial, sans-serif;
}

/* KHUNG ẢNH GỐC */
.card {
  position: relative;
  width: 100%;
  max-width: 667px;
  margin: 0 auto;
  line-height: 0;
}

.card img.background {
  display: block;
  width: 100%;
  height: auto;
}

/* CÁC VÙNG BẤM TRONG SUỐT */
.hotspot {
  position: absolute;
  display: block;
  z-index: 2;
  background: transparent;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* CHAT ZALO */
.zalo {
  left: 6%;
  top: 60.8%;
  width: 43.2%;
  height: 8.1%;
}

/* TIKTOK */
.tiktok {
  left: 51%;
  top: 60.8%;
  width: 43%;
  height: 8.1%;
}

/* GỌI NGAY */
.call {
  left: 6%;
  top: 69.8%;
  width: 43.2%;
  height: 7.2%;
}

/* FACEBOOK */
.facebook {
  left: 51%;
  top: 69.8%;
  width: 43%;
  height: 7.2%;
}

/* NGHE NHẠC */
.music {
  left: 6%;
  top: 77.9%;
  width: 43.2%;
  height: 7.2%;
}

/* QUÉT YÊU THƯƠNG */
.support {
  left: 51%;
  top: 77.9%;
  width: 43%;
  height: 7.2%;
}

/* CỬA SỔ QR */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(0,0,0,.92);
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-content {
  width: 100%;
  max-width: 360px;
  padding: 22px;
  text-align: center;
  border-radius: 20px;
  border: 2px solid #ffd400;
  background: #171722;
  box-shadow: 0 0 25px #ffd40066;
  line-height: normal;
}

.modal-content h2 {
  font-size: 19px;
  color: #ffe45c;
  margin-bottom: 18px;
}

.modal-content img {
  display: block;
  width: 100%;
  max-width: 270px;
  margin: auto;
  border-radius: 10px;
  background: white;
}

.close {
  margin-top: 18px;
  padding: 11px 35px;
  border: 0;
  border-radius: 10px;
  background: #ffd400;
  color: #171717;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<main class="card">

  <!-- ẢNH THIỆP MỚI -->
  <img
    class="background"
    src="https://i.ibb.co/QjbRzfBb/file-0000000043588211926391ad39ab3bb6.png"
    alt="Thiệp Vũ Lê - Kết nối, chia sẻ, lan tỏa yêu thương"
  >

  <!-- 6 VÙNG BẤM -->

  <a class="hotspot zalo"
     href="https://zaloapp.com/qr/p/1r5syh5imwilg?src=qr"
     target="_blank"
     rel="noopener"
     aria-label="Chat Zalo"></a>

  <a class="hotspot tiktok"
     href="https://www.tiktok.com/@giai.iu.c.kha"
     target="_blank"
     rel="noopener"
     aria-label="TikTok"></a>

  <a class="hotspot call"
     href="tel:0985345967"
     aria-label="Gọi ngay"></a>

  <a class="hotspot facebook"
     href="https://www.facebook.com/share/1Gt6EqZYMX/"
     target="_blank"
     rel="noopener"
     aria-label="Facebook"></a>

  <a class="hotspot music"
     href="https://callaryt.github.io/qr-am-nhac/"
     target="_blank"
     rel="noopener"
     aria-label="Nghe nhạc"></a>

  <button class="hotspot support"
          onclick="openQR()"
          aria-label="Quét yêu thương"></button>

</main>

<!-- CỬA SỔ QR TECHCOMBANK -->

<div class="modal" id="qrModal">

  <div class="modal-content">

    <h2>♥️ QUÉT YÊU THƯƠNG 💸</h2>

    <img
      src="qr-techcombank.jpg"
      alt="Mã QR thanh toán Techcombank"
    >

    <button class="close" onclick="closeQR()">
      Đóng
    </button>

  </div>

</div>

<script>
function openQR() {
  document.getElementById("qrModal").style.display = "flex";
}

function closeQR() {
  document.getElementById("qrModal").style.display = "none";
}

window.onclick = function(event) {
  const modal = document.getElementById("qrModal");

  if (event.target === modal) {
    closeQR();
  }
};
</script>

</body>
</html>
