<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a18">
<title>VŨ LÊ - NIGHT MUSIC</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: #090a18;
  overflow-x: hidden;
}

/* NỀN THÀNH PHỐ */
.city {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(180deg, #151a42aa, #090a18ee),
    radial-gradient(ellipse at 50% 35%, #b44c9c 0%, transparent 48%),
    linear-gradient(135deg, #182b55, #311a42 55%, #090a18);
}

.city::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 35px,
      #ffb85b18 36px 39px
    );
  opacity: .6;
}

.city::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 45%;
  bottom: 0;
  background:
    linear-gradient(0deg, #080916, transparent),
    repeating-linear-gradient(
      90deg,
      transparent 0 45px,
      #ffb84d18 46px 49px
    );
}

/* KHUNG CHÍNH */
.wrapper {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 30px 18px 35px;
}

/* PHẦN ĐẦU */
.hero {
  text-align: center;
  padding: 20px 10px 25px;
}

.intro {
  padding-top: 8px;
}

/* TAI NGHE NEON */
.headphones {
  position: relative;
  width: 145px;
  height: 145px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 88px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    #252b55,
    #111329 65%,
    transparent 72%
  );
  filter: drop-shadow(0 0 12px #00d9ff);
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00aaff,
    0 0 45px #9c4dff;
  animation: glow 2s ease-in-out infinite alternate;
}

.headphones::before {
  content: "♫  ♪  ♬";
  position: absolute;
  top: -10px;
  left: -20px;
  width: 185px;
  font-size: 22px;
  color: #ffda59;
  letter-spacing: 13px;
  text-shadow: 0 0 12px #ffd400;
  animation: notes 2s infinite alternate;
}

.headphones::after {
  content: "";
  position: absolute;
  inset: -9px;
  border: 2px solid #00d9ff;
  border-radius: 50%;
  box-shadow:
    0 0 12px #00d9ff,
    inset 0 0 15px #9d50ff;
}

@keyframes glow {
  from {
    filter: drop-shadow(0 0 10px #00d9ff);
  }
  to {
    filter:
      drop-shadow(0 0 24px #9d50ff)
      drop-shadow(0 0 12px #00d9ff);
  }
}

@keyframes notes {
  from { transform: translateY(5px); opacity: .5; }
  to { transform: translateY(-9px); opacity: 1; }
}

/* TÊN */
h1 {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 5px;
  color: #fff;
  text-shadow:
    0 0 8px #00d9ff,
    0 0 22px #9d50ff;
}

.note {
  margin-top: 10px;
  font-size: 15px;
  color: #f2dfff;
  letter-spacing: 1px;
}

/* 6 NÚT CHỨC NĂNG */
.buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
  padding: 15px 5px 25px;
}

.btn {
  min-height: 57px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: white;
  font-size: 15px;
  font-weight: bold;
  text-align: center;
  padding: 14px 6px;
  border: 1px solid #65caff;
  border-radius: 14px;
  background: linear-gradient(
    135deg,
    #17284ddd,
    #281746ee
  );
  box-shadow:
    0 0 8px #00bfff55,
    inset 0 0 10px #8b54ff22;
  transition: .25s;
}

.btn:active {
  transform: scale(.96);
  box-shadow: 0 0 20px #00d9ff;
}

/* NÚT QUÉT YÊU THƯƠNG */
.support {
  grid-column: 1 / -1;
  min-height: 65px;
  margin-top: 7px;
  color: #ffe45c;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
  border: 2px solid #ffd400;
  border-radius: 16px;
  background: linear-gradient(
    135deg,
    #29200b,
    #171326
  );
  box-shadow:
    0 0 8px #ffd400,
    0 0 20px #ffbd00aa,
    inset 0 0 15px #ffd40022;
  text-shadow: 0 0 10px #ffd400;
  cursor: pointer;
  animation: goldGlow 2s infinite alternate;
}

@keyframes goldGlow {
  from {
    box-shadow: 0 0 8px #ffd400;
  }
  to {
    box-shadow:
      0 0 18px #ffd400,
      0 0 32px #ffb700aa;
  }
}

/* CHÂN TRANG */
.footer {
  text-align: center;
  margin-top: 18px;
  font-size: 10px;
  letter-spacing: 2px;
  color: #c8c1e5;
  line-height: 1.8;
}

/* CỬA SỔ QR */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #000e;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-content {
  width: 100%;
  max-width: 360px;
  padding: 22px;
  text-align: center;
  border-radius: 20px;
  border: 2px solid #ffd400;
  background: #171722;
  box-shadow: 0 0 25px #ffd40066;
}

.modal-content h2 {
  font-size: 19px;
  color: #ffe45c;
  margin-bottom: 18px;
}

.modal-content img {
  display: block;
  width: 100%;
  max-width: 270px;
  margin: auto;
  border-radius: 10px;
  background: white;
}

.close {
  margin-top: 18px;
  padding: 11px 35px;
  border: 0;
  border-radius: 10px;
  background: #ffd400;
  color: #171717;
  font-weight: bold;
  cursor: pointer;
}

@media (max-width: 380px) {
  .wrapper {
    padding: 20px 12px 30px;
  }

  h1 {
    font-size: 34px;
  }

  .buttons {
    padding: 5px 6px 24px;
    gap: 10px;
  }

  .btn {
    font-size: 14px;
    padding: 14px 5px;
  }

  .headphones {
    width: 130px;
    height: 130px;
    font-size: 80px;
  }
}
</style>
</head>

<body>

<div class="city"></div>

<main class="wrapper">

  <section class="hero">
    <div class="intro">
      <div class="headphones">🎧</div>

      <h1>VŨ LÊ</h1>

      <p class="note">
        Cảm ơn bạn đã ủng hộ
      </p>
    </div>
  </section>

  <section class="buttons">

    <a class="btn"
       href="https://zaloapp.com/qr/p/1r5syh5imwilg?src=qr"
       target="_blank">
       💬 Chat Zalo
    </a>

    <a class="btn"
       href="https://www.tiktok.com/@giai.iu.c.kha"
       target="_blank">
       🎵 TikTok
    </a>

    <a class="btn"
       href="tel:0985345967">
       📞 Gọi ngay
    </a>

    <a class="btn"
       href="https://www.facebook.com/share/1Gt6EqZYMX/"
       target="_blank">
       📘 Facebook
    </a>

    <a class="btn"
       href="https://callaryt.github.io/qr-am-nhac/"
       target="_blank">
       🎵 Nghe nhạc
    </a>

    <button class="btn support" onclick="openQR()">
      ♥️ QUÉT YÊU THƯƠNG 💸
    </button>

  </section>

  <div class="footer">
    THANK YOU • WISH YOU PEACE & HAPPINESS
  </div>

</main>

<!-- CỬA SỔ THANH TOÁN -->
<div class="modal" id="qrModal">

  <div class="modal-content">

    <h2>♥️ QUÉT YÊU THƯƠNG 💸</h2>

    <img
      src="qr-techcombank.jpg"
      alt="Mã QR thanh toán Techcombank">

    <button class="close" onclick="closeQR()">
      Đóng
    </button>

  </div>

</div>

<script>
function openQR() {
  document.getElementById("qrModal").style.display = "flex";
}

function closeQR() {
  document.getElementById("qrModal").style.display = "none";
}

window.onclick = function(event) {
  const modal = document.getElementById("qrModal");

  if (event.target === modal) {
    closeQR();
  }
};
</script>

</body>
</html>
